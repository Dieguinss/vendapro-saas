<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VendaPro SaaS</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">

    <aside class="sidebar">

      <h2>VendaPro</h2>

      <a href="#">🏠 Dashboard</a>
      <a href="#">👥 Clientes</a>
      <a href="#">📈 Relatórios</a>
      <a href="#">⚙ Configurações</a>

    </aside>

    <main class="content">

      <header class="topbar">

        <h1>Dashboard</h1>

        <button onclick="abrirModal()">
          Novo Cliente
        </button>

      </header>

      <section class="cards">

        <div class="card">
          <h3>Faturamento</h3>
          <h2>R$ 12.580</h2>
        </div>

        <div class="card">
          <h3>Clientes</h3>
          <h2 id="total-clientes">0</h2>
        </div>

        <div class="card">
          <h3>Pedidos</h3>
          <h2>89</h2>
        </div>

      </section>

      <section class="clientes-box">

        <div class="clientes-topo">

          <h2>Lista de Clientes</h2>

          <input
            type="text"
            placeholder="Buscar cliente..."
            id="busca"
            onkeyup="buscarClientes()"
          >

        </div>

        <div id="lista-clientes"></div>

      </section>

    </main>

  </div>

  <!-- MODAL -->

  <div class="modal" id="modal">

    <div class="modal-box">

      <h2>Novo Cliente</h2>

      <input type="text" id="nome" placeholder="Nome">

      <input type="text" id="telefone" placeholder="Telefone">

      <input type="text" id="empresa" placeholder="Empresa">

      <select id="status">
        <option>Lead</option>
        <option>Cliente</option>
      </select>

      <button onclick="salvarCliente()">
        Salvar
      </button>

    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script src="script.js"></script>

</body>
</html>
