<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VendaPro SaaS</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <aside class="sidebar">

      <h2>VendaPro</h2>

      <a href="#">🏠 Dashboard</a>
      <a href="#">👥 Clientes</a>
      <a href="#">📈 Relatórios</a>
      <a href="#">⚙ Configurações</a>

    </aside>

    <main class="content">

      <header class="topbar">

        <h1>Dashboard</h1>

        <button onclick="abrirModal()">
          Novo Cliente
        </button>

        <button onclick="logout()">
          Sair
        </button>

      </header>

      <section class="cards">

        <div class="card">

          <h3>Total Clientes</h3>

          <h2 id="total-clientes">
            0
          </h2>

        </div>

        <div class="card">

          <h3>Leads Quentes</h3>

          <h2 id="leads-quentes">
            0
          </h2>

        </div>

        <div class="card">

          <h3>Fechados</h3>

          <h2 id="clientes-fechados">
            0
          </h2>

        </div>

      </section>

      <section class="clientes-box">

        <div class="clientes-topo">

          <h2>Funil de Vendas</h2>

          <input type="text" placeholder="Buscar cliente..." id="busca" onkeyup="buscarClientes()">

        </div>

        <div class="kanban">

          <div class="coluna">

            <h3>Lead</h3>

            <div 
              id="lead" 
              ondrop="soltar(event)" 
              ondragover="permitirSoltar(event)"
            ></div>

          </div>

          <div class="coluna">

            <h3>Contato</h3>

            <div
              id="contato"
              ondrop="soltar(event)"
              ondragover="permitirSoltar(event)"
            ></div>

          </div>

          <div class="coluna">

            <h3>Proposta</h3>

            <div
              id="proposta"
              ondrop="soltar(event)"
              ondragover="permitirSoltar(event)"
            ></div>

          </div>

          <div class="coluna">

            <h3>Fechado</h3>

            <div
              id="fechado"
              ondrop="soltar(event)"
              ondragover="permitirSoltar(event)"
            ></div>

          </div>

        </div>

      </section>

    </main>

  </div>

  <!-- MODAL -->

  <div class="modal" id="modal">

    <div class="modal-box">

      <h2>Novo Cliente</h2>

      <input type="text" id="nome" placeholder="Nome">

      <input type="text" id="telefone" placeholder="Telefone">

      <input type="text" id="empresa" placeholder="Empresa">

      <select id="status">
        <option>Lead</option>
        <option>Contato</option>
        <option>Proposta</option>
        <option>Fechado</option>
      </select>

      <button onclick="salvarCliente()">
        Salvar
      </button>

    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script src="script.js"></script>

</body>

</html>
